<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AskHub · Аналитика</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--panel2:#1a1a26;--ink:#f4f4f5;--ink-soft:#a1a1aa;--ink-mute:#71717a;--accent:#a78bfa;--good:#4ade80;--warn:#f59e0b;--bad:#ff7373;--line:#2a2a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.55}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px}
header .controls{display:flex;gap:8px;align-items:center}
input,select,button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 11px;font-size:13px;font-family:inherit}
button{cursor:pointer;background:var(--accent);border-color:var(--accent);color:#0a0a0f;font-weight:700}
button:hover{opacity:.9}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .label{color:var(--ink-mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.kpi .value{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700}
.kpi .sub{color:var(--ink-soft);font-size:12px;margin-top:2px}
.kpi.good .value{color:var(--good)}
.kpi.warn .value{color:var(--warn)}
.kpi.bad  .value{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-family:'Space Grotesk',sans-serif;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink-mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.pos{color:var(--good)}
td.neg{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.bar{height:6px;background:var(--panel2);border-radius:100px;overflow:hidden;margin-top:8px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#22d3ee)}
.gate{max-width:400px;margin:80px auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.gate h2{margin:0 0 12px;font-family:'Space Grotesk',sans-serif}
.gate p{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
.gate input{width:100%;margin-bottom:10px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.empty{color:var(--ink-mute);padding:20px;text-align:center}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h2>Админ-панель AskHub</h2>
  <p>Введите ADMIN_TOKEN (тот же, что в Netlify env).</p>
  <input id="token" type="password" placeholder="ADMIN_TOKEN" autofocus>
  <button id="login" style="width:100%">Войти</button>
  <div id="err" class="err" style="display:none"></div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>📊 AskHub · Бизнес-аналитика</h1>
    <div class="controls">
      <label style="color:var(--ink-mute);font-size:12px">Период:</label>
      <select id="days">
        <option value="1">Сутки</option>
        <option value="7">7 дней</option>
        <option value="30" selected>30 дней</option>
        <option value="90">90 дней</option>
        <option value="365">Год</option>
      </select>
      <button id="refresh">Обновить</button>
      <button id="logout" style="background:transparent;color:var(--ink-soft);border-color:var(--line)">Выход</button>
    </div>
  </header>

  <main>
    <div class="grid" id="kpi-grid"></div>

    <div class="two">
      <div class="card">
        <h3>По дням</h3>
        <div id="by-day-wrap"></div>
      </div>
      <div class="card">
        <h3>По моделям</h3>
        <div id="by-model-wrap"></div>
      </div>
    </div>

    <div class="card">
      <h3>Топ клиентов по выручке</h3>
      <div id="top-users-wrap"></div>
    </div>

    <div class="card">
      <h3>Разбивка по типам</h3>
      <div id="breakdown"></div>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtUsd = n => (n>=0?'$':'-$') + Math.abs(n).toFixed(2);
const fmtPct = n => (n||0).toFixed(1) + '%';

function saveToken(t){ localStorage.setItem('askhub_admin_token', t); }
function getToken(){ return localStorage.getItem('askhub_admin_token') || ''; }

async function loadStats(){
  const days = $('days').value;
  const r = await fetch('/api/admin-stats?days='+days, { headers: { 'X-Admin-Token': getToken() } });
  if (r.status === 401){ localStorage.removeItem('askhub_admin_token'); showGate('Неверный токен'); return; }
  const d = await r.json();
  renderKpi(d);
  renderByDay(d.by_day);
  renderByModel(d.by_model);
  renderTopUsers(d.top_users);
  renderBreakdown(d);
}

function renderKpi(d){
  const t = d.totals;
  const marginClass = t.margin_pct >= 60 ? 'good' : (t.margin_pct >= 30 ? 'warn' : 'bad');
  $('kpi-grid').innerHTML = `
    <div class="kpi good"><div class="label">Выручка</div><div class="value">${fmtUsd(t.revenue_usd)}</div><div class="sub">за ${d.period_days} дн.</div></div>
    <div class="kpi bad"><div class="label">Себестоимость</div><div class="value">${fmtUsd(t.cost_usd)}</div><div class="sub">API + Stripe</div></div>
    <div class="kpi good"><div class="label">Прибыль</div><div class="value">${fmtUsd(t.profit_usd)}</div><div class="sub">выручка − расход</div></div>
    <div class="kpi ${marginClass}"><div class="label">Маржа</div><div class="value">${fmtPct(t.margin_pct)}</div><div class="sub">по всей активности</div></div>
    <div class="kpi"><div class="label">Пользователей</div><div class="value">${t.users}</div><div class="sub">активных</div></div>
    <div class="kpi"><div class="label">Событий</div><div class="value">${t.events}</div><div class="sub">чат + картинки + оплаты</div></div>
  `;
}

function renderByDay(rows){
  if (!rows || !rows.length){ $('by-day-wrap').innerHTML='<div class="empty">Пока нет данных</div>'; return }
  const max = Math.max(...rows.map(r => r.revenue));
  $('by-day-wrap').innerHTML = `<table><thead><tr><th>День</th><th class="num">Выручка</th><th class="num">Расход</th><th class="num">Прибыль</th><th class="num">Chat</th><th class="num">Image</th><th class="num">Оплаты</th></tr></thead><tbody>${rows.map(r => {
    const pct = max > 0 ? (r.revenue/max*100) : 0;
    return `<tr><td>${r.day}</td><td class="num pos">${fmtUsd(r.revenue)}<div class="bar" style="width:60px;margin-left:auto"><div class="bar-fill" style="width:${pct}%"></div></div></td><td class="num neg">${fmtUsd(r.cost)}</td><td class="num ${r.profit>=0?'pos':'neg'}">${fmtUsd(r.profit)}</td><td class="num">${r.chat}</td><td class="num">${r.image}</td><td class="num">${r.topup}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function renderByModel(rows){
  if (!rows || !rows.length){ $('by-model-wrap').innerHTML='<div class="empty">Пока нет данных</div>'; return }
  $('by-model-wrap').innerHTML = `<table><thead><tr><th>Модель</th><th class="num">Сообщений</th><th class="num">Выручка</th><th class="num">Прибыль</th></tr></thead><tbody>${rows.map(r =>
    `<tr><td>${r.model}</td><td class="num">${r.msgs}</td><td class="num pos">${fmtUsd(r.revenue)}</td><td class="num ${r.profit>=0?'pos':'neg'}">${fmtUsd(r.profit)}</td></tr>`
  ).join('')}</tbody></table>`;
}

function renderTopUsers(rows){
  if (!rows || !rows.length){ $('top-users-wrap').innerHTML='<div class="empty">Пока нет данных</div>'; return }
  $('top-users-wrap').innerHTML = `<table><thead><tr><th>Клиент</th><th class="num">Chat</th><th class="num">Image</th><th class="num">Выручка</th><th class="num">Прибыль</th></tr></thead><tbody>${rows.map(r =>
    `<tr><td>${r.user}</td><td class="num">${r.chat}</td><td class="num">${r.image}</td><td class="num pos">${fmtUsd(r.revenue)}</td><td class="num ${r.profit>=0?'pos':'neg'}">${fmtUsd(r.profit)}</td></tr>`
  ).join('')}</tbody></table>`;
}

function renderBreakdown(d){
  $('breakdown').innerHTML = `<table><thead><tr><th>Тип</th><th class="num">Метрика</th></tr></thead><tbody>
    <tr><td>💬 Чат — бесплатно</td><td class="num">${d.chat.free}</td></tr>
    <tr><td>💬 Чат — платно</td><td class="num">${d.chat.paid}</td></tr>
    <tr><td>🎨 Standard картинки</td><td class="num">${d.images.standard}</td></tr>
    <tr><td>🎨 HD картинки</td><td class="num">${d.images.hd}</td></tr>
    <tr><td>🎨 Ultra картинки</td><td class="num">${d.images.ultra}</td></tr>
    <tr><td>🎁 Из них бесплатных (trial)</td><td class="num">${d.images.free_used}</td></tr>
    <tr><td>💳 Пополнений</td><td class="num">${d.topups.count} · ${fmtUsd(d.topups.revenue_usd)}</td></tr>
  </tbody></table>`;
}

function showApp(){ $('gate').style.display='none'; $('app').style.display='block'; loadStats(); }
function showGate(err){ $('gate').style.display='block'; $('app').style.display='none'; if(err){$('err').textContent=err;$('err').style.display='block'} }

$('login').onclick = () => { const t=$('token').value.trim(); if(!t) return; saveToken(t); showApp(); };
$('token').addEventListener('keydown', e => { if(e.key==='Enter') $('login').click() });
$('refresh').onclick = loadStats;
$('days').onchange = loadStats;
$('logout').onclick = () => { localStorage.removeItem('askhub_admin_token'); location.reload(); };

if (getToken()) showApp(); else showGate();
</script>
</body>
</html>
