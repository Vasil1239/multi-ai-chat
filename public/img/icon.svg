<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b6dff"/>
      <stop offset="50%" stop-color="#5b7dff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="256" y1="0" x2="256" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0a0d1c" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Squircle background (fills the whole canvas, so no black border) -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="260" rx="115" ry="115" fill="url(#shine)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#glow)"/>

  <!-- Speech bubble -->
  <g filter="url(#drop)">
    <path d="
      M 128 156
      Q 128 116 168 116
      L 344 116
      Q 384 116 384 156
      L 384 296
      Q 384 336 344 336
      L 258 336
      L 200 386
      Q 186 397 186 380
      L 186 336
      L 168 336
      Q 128 336 128 296
      Z" fill="#ffffff"/>
  </g>

  <!-- Hub connections -->
  <g stroke="#5b7dff" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="226" x2="192" y2="178"/>
    <line x1="256" y1="226" x2="320" y2="178"/>
    <line x1="256" y1="226" x2="192" y2="274"/>
    <line x1="256" y1="226" x2="320" y2="274"/>
  </g>

  <!-- Satellite nodes -->
  <circle cx="192" cy="178" r="18" fill="#7c5cff"/>
  <circle cx="320" cy="178" r="18" fill="#22d3ee"/>
  <circle cx="192" cy="274" r="18" fill="#22d3ee"/>
  <circle cx="320" cy="274" r="18" fill="#7c5cff"/>

  <!-- Central hub -->
  <circle cx="256" cy="226" r="30" fill="url(#node)"/>
  <circle cx="256" cy="219" r="11" fill="#ffffff" opacity="0.55"/>
</svg>
