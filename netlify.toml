[build]
  functions = "netlify/functions"
  publish = "public"

# По умолчанию у sync-функций Netlify 10 сек. Для image.js это мало (Ultra ~25 сек).
# Pro/Business план поддерживает до 26 сек через явное указание.
[functions.image]
  timeout = 26

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/admin-credits"
  to = "/.netlify/functions/admin-credits"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/api/credits"
  to = "/.netlify/functions/credits"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

[[redirects]]
  from = "/api/admin-stats"
  to = "/.netlify/functions/admin-stats"
  status = 200

# no-cache для HTML — чтобы UI-апдейты видны сразу после деплоя
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 301: старый netlify.app адрес → основной askhub.net
[[redirects]]
  from = "https://mylty.netlify.app/*"
  to = "https://askhub.net/:splat"
  status = 301
  force = true
