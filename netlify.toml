[build]
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/.netlify/functions/models"
  status = 200

[[redirects]]
  from = "/api/credits"
  to = "/.netlify/functions/credits"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/create-checkout"
  status = 200

# 301: старый netlify.app адрес → основной askhub.net
[[redirects]]
  from = "https://mylty.netlify.app/*"
  to = "https://askhub.net/:splat"
  status = 301
  force = true
